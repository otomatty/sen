name: テスト & Cloudflare へデプロイ

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_tutorials:
        description: "操作説明動画を AI に再収録させてからデプロイする"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: 使い方動画が最新の画面で撮られているか確認
        run: bun run tutorials:check || echo "::warning::画面が変わった使い方動画があります。workflow_dispatch の record_tutorials で撮り直してください"
      - name: Playwright と日本語フォントを準備
        run: |
          bunx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: E2E テスト
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: 操作説明動画を再収録（AI がヘッドレスブラウザで操作）
        if: ${{ inputs.record_tutorials }}
        run: |
          bunx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
          bun run tutorials
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.record_tutorials }}
        with:
          name: tutorials
          path: public/tutorials
      - name: ビルド
        run: bunx vite build && node scripts/predeploy.mjs
      - name: D1 のスキーマを適用
        run: bunx wrangler d1 migrations apply sen-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: デプロイ
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
